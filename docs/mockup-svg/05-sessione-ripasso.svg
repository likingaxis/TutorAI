<text x="312" y="218" fill="#f2f5fc" font-size="30" font-weight="650" >I timestamp bastano per stabilire causalità?</text>
<text x="312" y="252" fill="#a6b1c6" font-size="16" font-weight="400" >Osserva gli eventi A e B registrati sui processi P₁ e P₂:</text>
<rect x="312" y="276" width="976" height="196" rx="16" fill="#181f2c" stroke="#2b3548" />
<text x="348" y="330" fill="#f2f5fc" font-size="16" font-weight="650" >P₁</text>
<text x="348" y="424" fill="#f2f5fc" font-size="16" font-weight="650" >P₂</text>
<line x1="396" y1="324" x2="1236" y2="324" stroke="#4c5c78" stroke-width="2.2" />
<line x1="396" y1="418" x2="1236" y2="418" stroke="#4c5c78" stroke-width="2.2" />
