<text x="632" y="328" fill="#92aaff" font-size="14" font-weight="650" text-anchor="middle">C(A) = 3</text>
<circle cx="1010" cy="418" r="15" fill="#dce4f5" />
<text x="1010" y="423" fill="#0e172a" font-size="13" font-weight="700" text-anchor="middle">B</text>
<rect x="1036" y="402" width="92" height="30" rx="8" fill="#222b3d" />
<text x="1082" y="422" fill="#dce4f5" font-size="14" font-weight="650" text-anchor="middle">C(B) = 5</text>
<text x="312" y="518" fill="#f2f5fc" font-size="18.5" font-weight="600" >Quale affermazione è corretta?</text>
<rect x="312" y="540" width="976" height="66" rx="13" fill="#161c27" stroke="#2b3548" />
<circle cx="348" cy="573" r="12" fill="none" stroke="#596780" stroke-width="1.8" />
<text x="348" y="578" fill="#a6b1c6" font-size="13" font-weight="700" text-anchor="middle">A</text>
<text x="384" y="579" fill="#f2f5fc" font-size="16.5" font-weight="400" >A ha causato B, perché il suo timestamp è minore (3 &lt; 5).</text>
<rect x="312" y="622" width="976" height="66" rx="13" fill="#213252" stroke="#92aaff" />
<circle cx="348" cy="655" r="12" fill="#92aaff" stroke="#92aaff" stroke-width="1.8" />
<text x="348" y="660" fill="#0e172a" font-size="13" font-weight="700" text-anchor="middle">B</text>
<text x="384" y="661" fill="#f2f5fc" font-size="16.5" font-weight="600" >A e B sono concorrenti: non esiste una relazione causale tra loro.</text>
<rect x="312" y="704" width="976" height="66" rx="13" fill="#161c27" stroke="#2b3548" />
<circle cx="348" cy="737" r="12" fill="none" stroke="#596780" stroke-width="1.8" />
<text x="348" y="742" fill="#a6b1c6" font-size="13" font-weight="700" text-anchor="middle">C</text>
<text x="384" y="743" fill="#f2f5fc" font-size="16.5" font-weight="400" >B ha causato A, perché il suo timestamp è maggiore (5 &gt; 3).</text>
