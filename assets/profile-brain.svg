          <path d="M128 48L138 96L97 69L116 153L138 96"/>
          <path d="M64 88L116 153L57 136"/>
          <path d="M63 186L116 153L100 216"/>
          <path d="M116 153L144 154M116 153L136 212"/>
        </g>
        <g fill="#9cb8ff" fill-opacity=".18">
          <circle cx="128" cy="48" r="3.4"/>
          <circle cx="64" cy="88" r="3.2"/>
          <circle cx="138" cy="96" r="3.4"/>
          <circle cx="144" cy="154" r="3.6"/>
          <circle cx="63" cy="186" r="3.2"/>
          <circle cx="136" cy="212" r="3.2"/>
        </g>
        <g fill="#c9dcff" fill-opacity=".86">
