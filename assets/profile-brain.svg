<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 280">
  <title>Atlante cognitivo a costellazione a due emisferi</title>
  <defs>
    <radialGradient id="atlasAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ea4ff" stop-opacity=".24"/>
      <stop offset="58%" stop-color="#537cf0" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#0f1738" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hemiFill" x1=".15" y1=".05" x2=".85" y2=".95" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#182654"/>
      <stop offset="56%" stop-color="#131e46"/>
      <stop offset="100%" stop-color="#0f1738"/>
    </linearGradient>
    <linearGradient id="axisGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7ea4ff" stop-opacity="0"/>
