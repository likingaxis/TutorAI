          <circle cx="64" cy="88" r="1.4"/>
          <circle cx="138" cy="96" r="1.6"/>
          <circle cx="144" cy="154" r="1.7"/>
          <circle cx="63" cy="186" r="1.4"/>
          <circle cx="136" cy="212" r="1.5"/>
        </g>
        <g fill="#9cb8ff" fill-opacity=".42">
